# ─────────────────────────────────────────────────────────────────────────────
# NeuroHub Meta by @goldneuron.io — orquestração Docker.
#   1) cp .env.example .env   (preencha PUBLIC_URL, SESSION_SECRET, DATA_ENCRYPTION_KEY e ADMIN_PASSWORD)
#   2) docker compose up -d --build
#
# A porta INTERNA do container é fixada em 3300; escolha a porta do host com
# HOST_PORT (padrão 3300). Ex.: HOST_PORT=8080 docker compose up -d
# ─────────────────────────────────────────────────────────────────────────────
services:
  meta-apphub:
    build:
      context: .
      dockerfile: Dockerfile
    image: goldneuron-meta-apphub:latest
    container_name: goldneuron-meta-apphub
    restart: unless-stopped

    # Configuração e segredos (PUBLIC_URL, SESSION_SECRET, DATA_ENCRYPTION_KEY, ADMIN_PASSWORD, META_*…).
    env_file:
      - .env

    # Porta interna fixa em 3300 (sobrepõe qualquer PORT do .env); host = HOST_PORT.
    environment:
      - PORT=3300
    ports:
      - "${HOST_PORT:-3300}:3300"

    # Persistência dos arquivos JSON (apps/canais/eventos/settings).
    volumes:
      - goldneuron-meta-apphub-data:/app/data

volumes:
  goldneuron-meta-apphub-data:
    driver: local
