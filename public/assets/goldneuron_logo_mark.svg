<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
  <title id="title">goldneuron.io lightbulb brain circuit logo</title>
<desc id="desc">A premium gold line-art lightbulb logo containing a stylized neural brain and circuit traces.</desc>

<defs>
  <linearGradient id="goldStroke" gradientUnits="userSpaceOnUse" x1="190" y1="90" x2="800" y2="940">
    <stop offset="0%" stop-color="#FFF3A8"/>
    <stop offset="28%" stop-color="#F8C949"/>
    <stop offset="58%" stop-color="#D99A04"/>
    <stop offset="100%" stop-color="#FFDB62"/>
